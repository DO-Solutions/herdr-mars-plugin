# template: Claude Code (Anthropic key)
# Flat agents.yaml manifest for DigitalOcean Managed Agents.
# ${VAR} values are expanded by doctl from your local environment (prompted when missing).
# Keep credentials under secrets:, never under env:.
name: my-claude-agent
agent: claude-code
size: mv-2vcpu-4gb
persistent_workspace: true
env:
  ANTHROPIC_MODEL: sonnet
secrets:
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
permissions:
  default: ask
  rules:
    - tool: bash
      match: { command: "git *" }
      action: allow
    - tool: bash
      match: { command: "rm -rf *" }
      action: deny
    - tool: file.write
      match: { path: "/workspace/**" }
      action: allow
